name: Build L7N Client

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show ZIP contents
        run: |
          echo "Current directory:"
          pwd
          echo "Files and folders:"
          find . -maxdepth 5 -type f \( -name "settings.gradle" -o -name "build.gradle" -o -name "gradlew" \) -print
          echo "Root folders:"
          ls -la

      - name: Build client
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "لم يتم العثور على settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project found at: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon
          
