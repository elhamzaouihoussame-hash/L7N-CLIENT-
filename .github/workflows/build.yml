name: Build L7N Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unzip project if zip exists
        run: |
          echo "Looking for zip files..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Unzipping..."
            unzip -q "$ZIP_FILE" -d extracted_project
            echo "Contents after unzip:"
            ls -la extracted_project
          else
            echo "No zip file found, using repository files directly."
          fi

      - name: Build client
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "خطأ: لم يتم العثور على ملف settings.gradle نهائياً."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project found at: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon
          
