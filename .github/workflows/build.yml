      - name: Show ZIP contents
        run: |
          echo "Current directory:"
          pwd
          echo "Files and folders:"
          find . -maxdepth 5 -type f \( -name "settings.gradle" -o -name "build.gradle" -o -name "gradlew" \) -print
          echo "Root folders:"
          ls -la

      - name: Build client
        run: |
          PROJECT_DIR=$(find . -type f -name "settings.gradle" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على settings.gradle"
            exit 1
          fi
          echo "Project found at: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon
